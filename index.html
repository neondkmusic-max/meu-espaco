<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Espaço">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Meu Espaço</title>
<style>
  :root {
    --bg: #f7f3ea; --card: #fffdf8; --text: #3d3d3a; --muted: #6f6f66;
    --sage: #6f8f77; --sage-soft: #e3ebe4; --line: #e6dfd1;
    --shadow: 0 2px 10px rgba(60, 50, 30, 0.06);
    --neon-azul: #0077b6; --neon-verde: #2e8b57; --neon-laranja: #c75a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f211e; --card: #2a2d29; --text: #ece7dc; --muted: #b5b3a8;
      --sage: #9dbba4; --sage-soft: #33392f; --line: #3a3d38; --shadow: none;
      --neon-azul: #00e5ff; --neon-verde: #39ff14; --neon-laranja: #ff8c1a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f211e; --card: #2a2d29; --text: #ece7dc; --muted: #b5b3a8;
    --sage: #9dbba4; --sage-soft: #33392f; --line: #3a3d38; --shadow: none;
    --neon-azul: #00e5ff; --neon-verde: #39ff14; --neon-laranja: #ff8c1a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    background: var(--bg); color: var(--text); font-size: 17px; line-height: 1.6;
    font-weight: 700; padding-top: env(safe-area-inset-top, 0px);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2 { font-weight: 700; margin: 0; }

  .app { max-width: 560px; margin: 0 auto; padding: 20px 18px 120px; }
  .tela { display: none; }
  .tela.ativa { display: block; animation: surgir .25s ease; }
  @keyframes surgir { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .header { margin: 8px 0 22px; }
  .header .saudacao { color: var(--muted); font-size: 15px; }
  .header h1 { font-size: 30px; margin-top: 2px; color: var(--neon-verde); }
  .header p { color: var(--muted); margin: 6px 0 0; font-size: 15px; }
  .topo-tela { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
  .topo-tela h1 { font-size: 24px; color: var(--neon-verde); }
  .voltar {
    min-width: 44px; min-height: 44px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); font-size: 18px;
  }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  .convite { background: var(--sage-soft); border-radius: 18px; padding: 14px 16px; margin-bottom: 22px; font-size: 15px; }
  .secao-titulo { font-size: 14px; color: var(--neon-laranja); text-transform: uppercase; letter-spacing: .08em; margin: 24px 0 10px; }
  .sub-topo, .dica { color: var(--muted); font-size: 15px; margin: 4px 0 14px; }

  .atalhos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .atalho {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; min-height: 84px;
    padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; font-size: 13px; line-height: 1.25; box-shadow: var(--shadow);
  }
  .atalho .icone { font-size: 22px; }
  .areas { display: grid; gap: 10px; }
  .area {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px; min-height: 64px; box-shadow: var(--shadow);
  }
  .area .icone {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: var(--sage-soft); font-size: 20px; flex-shrink: 0;
  }
  .area strong { display: block; font-size: 17px; color: var(--neon-azul); }
  .area small { color: var(--muted); font-size: 13px; }

  .controles { display: grid; gap: 8px; margin-bottom: 12px; }
  .controles input[type="search"], .controles select,
  .form input, .form select, .form textarea {
    width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .form textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  .form textarea.grande { min-height: 260px; }
  .form label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 15px; }
  .form label:first-child { margin-top: 0; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; }
  .check input { width: 22px; height: 22px; }

  .botao-principal {
    display: block; width: 100%; margin: 12px 0 14px; min-height: 52px;
    background: var(--sage); color: #fff; border: none; border-radius: 16px; font-size: 16px;
  }
  .botao-secundario {
    min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--sage);
    background: transparent; color: var(--sage);
  }
  .botao-perigo {
    min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid #c0584a;
    background: transparent; color: #c0584a;
  }
  .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .status { font-size: 14px; color: var(--muted); min-height: 22px; margin-bottom: 8px; }

  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); cursor: pointer;
  }
  .item-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .nome-item { color: var(--neon-azul); font-size: 17px; word-break: break-word; }
  .sub { color: var(--muted); font-size: 14px; }
  .previa { margin: 6px 0; overflow: hidden; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .item small { color: var(--muted); font-size: 13px; }
  .texto-livre { white-space: pre-wrap; margin: 0; word-break: break-word; }
  .estrela {
    background: none; border: none; font-size: 22px; color: var(--muted);
    min-width: 40px; min-height: 40px; padding: 0; line-height: 1;
  }
  .estrela.on { color: var(--neon-laranja); }
  .acoes-mini { display: flex; gap: 14px; margin-top: 6px; }
  .link { background: none; border: none; color: var(--sage); padding: 6px 0; font-size: 14px; min-height: 36px; }
  .link.perigo { color: #c0584a; }
  .dia { margin-bottom: 16px; }

  .vazio { text-align: center; color: var(--muted); padding: 36px 18px; }
  .vazio .icone { font-size: 38px; display: block; margin-bottom: 8px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 20px;
    padding: 8px 12px; min-height: 40px; font-size: 14px; color: var(--text);
  }
  .chip.ativa { background: var(--sage); color: #fff; border-color: var(--sage); }
  .linha { display: flex; gap: 8px; margin-top: 6px; }
  .linha input { flex: 1; min-height: 48px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--text); }

  .abas { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .aba { flex: 1 1 110px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  .aba.ativa { background: var(--sage); color: #fff; border-color: var(--sage); }

  .opcao {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    min-height: 56px; padding: 12px 16px; margin-bottom: 10px; text-align: left;
  }
  .chave { width: 48px; height: 28px; border-radius: 20px; background: var(--line); position: relative; flex-shrink: 0; }
  .chave::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; transition: transform .2s;
  }
  .chave.ligada { background: var(--sage); }
  .chave.ligada::after { transform: translateX(20px); }

  nav.barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  nav.barra button {
    flex: 1; max-width: 100px; min-height: 56px; border: none; background: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 12px; color: var(--muted); border-radius: 12px;
  }
  nav.barra button .icone { font-size: 20px; }
  nav.barra button.ativo { color: var(--neon-verde); }

  .aviso {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 14px;
    font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none;
    max-width: 90%; text-align: center; z-index: 20;
  }
  .aviso.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }
  .acoes-grav { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .acoes-grav button { flex: 1; min-height: 52px; font-size: 15px; margin: 0; }
  .tempo { font-size: 40px; text-align: center; margin: 8px 0; font-variant-numeric: tabular-nums; }
  #indicador { text-align: center; min-height: 24px; color: var(--muted); }
  #painelGrav.gravando #indicador { color: #e0533d; animation: pisca 1.2s infinite; }
  @keyframes pisca { 50% { opacity: .45; } }
  audio { width: 100%; margin: 8px 0; }
</style>
</head>
<body>
<div class="app">

  <section id="inicio" class="tela ativa">
    <div class="header">
      <div class="saudacao" id="saudacao">Bem-vinda</div>
      <h1>Meu Espaço</h1>
      <p>Um cantinho só seu, para escrever, orar e respirar.</p>
    </div>
    <div class="convite">Que tal registrar uma coisa boa de hoje em “Tudo de bom que Jeová me deu”?</div>

    <div class="secao-titulo">Atalhos rápidos</div>
    <div class="atalhos">
      <button class="atalho" data-novo="nota"><span class="icone">📝</span>Nova nota</button>
      <button class="atalho" data-novo="oracao"><span class="icone">🙏</span>Registrar oração</button>
      <button class="atalho" data-novo="gratidao"><span class="icone">🌿</span>Adicionar gratidão</button>
      <button class="atalho" data-novo="humor"><span class="icone">🌤️</span>Registrar humor</button>
      <button class="atalho" data-ir="gravador"><span class="icone">🎙️</span>Gravar áudio</button>
      <button class="atalho" data-novo="musica"><span class="icone">🎵</span>Escrever música</button>
    </div>

    <div class="secao-titulo">Áreas</div>
    <div class="areas">
      <button class="area" data-ir="caderno"><span class="icone">📓</span><span><strong>Meu Caderno</strong><small>Notas, ideias e reflexões</small></span></button>
      <button class="area" data-ir="musicas"><span class="icone">🎵</span><span><strong>Minhas Músicas</strong><small>Composições e portfólio</small></span></button>
      <button class="area" data-ir="espaco"><span class="icone">🕊️</span><span><strong>Meu Espaço com Jeová</strong><small>Orações, gratidão e reflexões</small></span></button>
      <button class="area" data-ir="emocional"><span class="icone">💭</span><span><strong>Meu Diário Emocional</strong><small>Humor e desabafos</small></span></button>
      <button class="area" data-ir="versiculos"><span class="icone">📖</span><span><strong>Meu Baú de Versículos</strong><small>Palavras para momentos especiais</small></span></button>
      <button class="area" data-ir="assistente"><span class="icone">✍️</span><span><strong>Meu Assistente Criativo</strong><small>Rimas, sinônimos e imagens</small></span></button>
      <button class="area" data-ir="config"><span class="icone">⚙️</span><span><strong>Configurações e Backup</strong><small>Aparência e cópias de segurança</small></span></button>
    </div>
  </section>

  <section id="pagina" class="tela"></section>
</div>

<nav class="barra" aria-label="Navegação principal">
  <button data-ir="inicio" class="ativo"><span class="icone">🏠</span>Início</button>
  <button data-ir="caderno"><span class="icone">📓</span>Caderno</button>
  <button data-ir="musicas"><span class="icone">🎵</span>Músicas</button>
  <button data-ir="emocional"><span class="icone">💭</span>Diário</button>
  <button data-ir="config"><span class="icone">⚙️</span>Ajustes</button>
</nav>
<div class="aviso" id="aviso"></div>

<script>
(function () {
  "use strict";

  /* ============ UTILITÁRIOS ============ */
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var agora = function () { return new Date().toISOString(); };
  var hojeISO = function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var agoraLocal = function () { var d = new Date(); return hojeISO() + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  var novoId = function () { return "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var fmtDH = function (v) { return v ? new Date(v).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; };
  var fmtD = function (v) { return v ? new Date(v.length === 10 ? v + "T12:00:00" : v).toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" }) : ""; };
  var hora = function (v) { return new Date(v).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
  var cmp = function (campo) { return function (a, b) { return String(b[campo] || "").localeCompare(String(a[campo] || "")); }; };
  var cmpTexto = function (campo) { return function (a, b) { return String(a[campo] || "").localeCompare(String(b[campo] || ""), "pt-BR"); }; };

  function aviso(msg) {
    var el = document.getElementById("aviso");
    el.textContent = msg;
    el.classList.add("mostrar");
    clearTimeout(aviso.t);
    aviso.t = setTimeout(function () { el.classList.remove("mostrar"); }, 2600);
  }

  /* ============ DADOS (IndexedDB, somente neste aparelho) ============ */
  var dbPromise = new Promise(function (ok, falha) {
    var r = indexedDB.open("meu-espaco", 1);
    r.onupgradeneeded = function () {
      var s = r.result.createObjectStore("itens", { keyPath: "id" });
      s.createIndex("tipo", "tipo");
    };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { falha(r.error); };
  });

  function operar(modo, fazer) {
    return dbPromise.then(function (db) {
      return new Promise(function (ok, falha) {
        var t = db.transaction("itens", modo);
        var req = fazer(t.objectStore("itens"));
        t.oncomplete = function () { ok(req ? req.result : undefined); };
        t.onerror = function () { falha(t.error); };
        t.onabort = function () { falha(t.error); };
      });
    });
  }
  var salvarItem = function (it) { return operar("readwrite", function (s) { return s.put(it); }); };
  var excluirItem = function (id) { return operar("readwrite", function (s) { return s.delete(id); }); };
  var obterItem = function (id) { return operar("readonly", function (s) { return s.get(id); }); };
  var listar = function (tipo) { return operar("readonly", function (s) { return s.index("tipo").getAll(tipo); }); };

  /* ============ CONFIGURAÇÕES DE CONTEÚDO ============ */
  var EMOCOES = ["Feliz", "Em paz", "Grata", "Animada", "Tranquila", "Triste", "Ansiosa", "Frustrada", "Cansada", "Desanimada", "Confusa", "Sobrecarregada"];
  var ESTADOS = ["Ideia inicial", "Rascunho", "Composição em andamento", "Revisão", "Concluída"];
  var INTENS = ["Leve", "Média", "Forte"];
  var CATEGORIAS = [
    "Quando estiver triste", "Quando estiver ansiosa ou preocupada", "Quando estiver desanimada",
    "Quando precisar de coragem", "Quando estiver com medo", "Quando precisar de esperança",
    "Quando sentir gratidão", "Quando precisar de consolo", "Quando quiser fortalecer minha fé",
    "Quando precisar de paz e tranquilidade"
  ];

  var TIPOS = {
    nota: { nome: "nota", fav: true, campos: [
      { k: "titulo", l: "Título", t: "text" },
      { k: "pasta", l: "Pasta (ex.: Ideias, Reflexões)", t: "text", lista: true },
      { k: "texto", l: "Escreva aqui", t: "area", g: true }
    ]},
    musica: { nome: "música", campos: [
      { k: "titulo", l: "Título provisório", t: "text" },
      { k: "estado", l: "Etapa atual", t: "select", o: ESTADOS },
      { k: "genero", l: "Gênero ou estilo", t: "text" },
      { k: "letra", l: "Letra ou trechos", t: "area", g: true },
      { k: "observacoes", l: "Observações do processo criativo", t: "area" },
      { k: "dataConclusao", l: "Data de conclusão (quando finalizar)", t: "date" }
    ]},
    oracao: { nome: "oração", fav: true, campos: [
      { k: "titulo", l: "Título", t: "text" },
      { k: "categoria", l: "Categoria (opcional)", t: "text" },
      { k: "texto", l: "Escreva com sinceridade", t: "area", g: true }
    ]},
    reflexao: { nome: "reflexão", campos: [
      { k: "titulo", l: "Título", t: "text" },
      { k: "tema", l: "Tema", t: "text" },
      { k: "texto", l: "Sua reflexão", t: "area", g: true }
    ]},
    gratidao: { nome: "gratidão", campos: [
      { k: "data", l: "Dia", t: "date" },
      { k: "texto", l: "Coisa boa pela qual sou grata", t: "area", g: true }
    ]},
    humor: { nome: "registro de humor", campos: [
      { k: "data", l: "Data e hora", t: "datetime" },
      { k: "emocoes", l: "Como você está? Escolha quantas quiser", t: "chips", o: EMOCOES },
      { k: "intensidade", l: "Intensidade (opcional)", t: "select", o: INTENS },
      { k: "texto", l: "Quer contar mais?", t: "area" }
    ]},
    desabafo: { nome: "desabafo", fav: true, campos: [
      { k: "titulo", l: "Título (opcional)", t: "text" },
      { k: "categoria", l: "Categoria pessoal (opcional)", t: "text" },
      { k: "texto", l: "Escreva livremente", t: "area", g: true }
    ]},
    versiculo: { nome: "versículo", fav: true, campos: [
      { k: "referencia", l: "Referência (ex.: Salmo 23:1)", t: "text" },
      { k: "traducao", l: "Tradução ou edição usada", t: "text" },
      { k: "texto", l: "Texto do versículo (digite ou cole o seu)", t: "area" },
      { k: "categorias", l: "Quando ele me ajuda", t: "chips", o: CATEGORIAS, nova: true },
      { k: "comentario", l: "Comentário pessoal", t: "area" },
      { k: "momento", l: "Como ele me ajudou em um momento específico", t: "area" }
    ]}
  };

  var NOVO = {
    gratidao: function () { return { data: hojeISO() }; },
    humor: function () { return { data: agoraLocal(), intensidade: "" }; },
    musica: function () { return { estado: "Ideia inicial" }; }
  };

  var LISTAS = {
    caderno: { tipo: "nota", titulo: "Meu Caderno", voltar: "inicio", novo: "Nova nota", fav: true,
      vazio: "Ainda não há notas aqui. Toque em “Nova nota” para começar.",
      ordens: {
        edicao: ["Última edição", cmp("editada")],
        criacao: ["Data de criação", cmp("criada")],
        titulo: ["Título", cmpTexto("titulo")]
      },
      controles: function (itens, f) {
        var pastas = [];
        itens.forEach(function (i) { if (i.pasta && pastas.indexOf(i.pasta) < 0) pastas.push(i.pasta); });
        return '<select data-f="pasta"><option value="">Todas as pastas</option>' +
          pastas.map(function (p) { return '<option value="' + esc(p) + '" ' + (f.pasta === p ? "selected" : "") + ">" + esc(p) + "</option>"; }).join("") + "</select>";
      },
      filtro: function (i, f) { return !f.pasta || i.pasta === f.pasta; },
      texto: function (i) { return [i.titulo, i.texto, i.pasta].join(" "); },
      card: function (i) { return { t: i.titulo || "Sem título", s: i.pasta ? "📁 " + i.pasta : "", p: i.texto, d: fmtDH(i.editada) }; }
    },

      b.classList.toggle("ativo", b.getAttribute("data-ir") === navGrupo(id));

    try {

      aviso("Não foi possível abrir esta tela. Seus dados continuam guardados.");

  /* ============ EDITOR ============ */
  function campoHtml(c, obj) {
    var v = obj[c.k] == null ? "" : obj[c.k];
    var rot = '<label for="c-' + c.k + '">' + c.l + "</label>";
    if (c.t === "area") {
      return rot + '<textarea id="c-' + c.k + '" data-campo="' + c.k + '" class="' + (c.g ? "grande" : "") + '">' + esc(v) + "</textarea>";
    }
    if (c.t === "select") {
      return rot + '<select id="c-' + c.k + '" data-campo="' + c.k + '"><option value="">Escolher</option>' +
        c.o.map(function (o) { return '<option value="' + esc(o) + '" ' + (o === v ? "selected" : "") + ">" + esc(o) + "</option>"; }).join("") +
        "</select>";
    }
    if (c.t === "chips") {
      var sel = obj[c.k] || [];
      var opts = c.o.concat(sel.filter(function (x) { return c.o.indexOf(x) < 0; }));
      return rot + '<div class="chips">' + opts.map(function (o) {
        return '<button class="chip ' + (sel.indexOf(o) >= 0 ? "ativa" : "") + '" data-a="chip" data-k="' + c.k + '" data-v="' + esc(o) + '">' + esc(o) + "</button>";
      }).join("") + "</div>" +
      (c.nova ? '<div class="linha"><input id="novaCat" placeholder="Outra situação"><button class="botao-secundario" data-a="addChip" data-k="' + c.k + '">Adicionar</button></div>' : "");
    }
    var tipoInput = c.t === "datetime" ? "datetime-local" : c.t === "date" ? "date" : "text";
    return rot + '<input type="' + tipoInput + '" id="c-' + c.k + '" data-campo="' + c.k + '" value="' + esc(v) + '"' +
      (c.lista ? ' list="listaPastas"' : "") + ">";
  }

  function acoesEd() {
    var T = TIPOS[ed.tipo];
    return (T.fav ? '<button class="botao-secundario" data-a="favEd">' + (ed.obj.favorita ? "★ Favorita" : "☆ Favoritar") + "</button>" : "") +
      (ed.obj.id ? '<button class="botao-perigo" data-a="excluirEd">Excluir</button>' : "");

  function telaEditor() {
    var T = TIPOS[ed.tipo];
    var campos = T.campos.map(function (c) { return campoHtml(c, ed.obj); }).join("");

      '<div class="status" id="status">' + (ed.obj.editada ? "Salvo às " + hora(ed.obj.editada) : "Escreva e eu salvo automaticamente.") + "</div>" +
      '<div class="card form">' + campos + "</div>" +
      '<div class="acoes" id="acoesEd">' + acoesEd() + "</div>" + pastas;

  function redesenharEditor() {
    document.getElementById("pagina").innerHTML = telaEditor();
  }

  function mostrarStatus(t) {
    var s = document.getElementById("status");
    if (s) s.textContent = t;
  }

  async function abrirEditor(tipo, id) {
    var origem = rotaAtual;
    listaAtual = null;
    var obj;
    if (id) {
      obj = await obterItem(id);
      if (!obj) { aviso("Este registro não foi encontrado."); return irPara(origem); }
    } else {
      obj = { tipo: tipo, favorita: false, emocoes: [], categorias: [] };
      if (NOVO[tipo]) {
        var extra = NOVO[tipo]();
        Object.keys(extra).forEach(function (k) { obj[k] = extra[k]; });
      }
    }
    var pastas = [];
    if (tipo === "nota") {
      (await listar("nota")).forEach(function (n) { if (n.pasta && pastas.indexOf(n.pasta) < 0) pastas.push(n.pasta); });
    }
    ed = { tipo: tipo, obj: obj, origem: origem, timer: null, pastas: pastas };
    mostrarPagina(true);
    redesenharEditor();
    window.scrollTo(0, 0);
  }

  function temConteudo(obj, tipo) {
    return TIPOS[tipo].campos.some(function (c) {
      if (c.t === "date" || c.t === "datetime" || c.t === "select") return false;
      var v = obj[c.k];
      return Array.isArray(v) ? v.length > 0 : String(v == null ? "" : v).trim() !== "";
    });
  }

  async function persistir() {
    var e = ed;
    if (!e) return;
    if (!e.obj.id && !temConteudo(e.obj, e.tipo)) return;
    var novo = !e.obj.id;
    if (novo) { e.obj.id = novoId(); e.obj.criada = agora(); }
    e.obj.editada = agora();
    try {
      await salvarItem(e.obj);
      mostrarStatus("Salvo às " + hora(e.obj.editada));
      if (novo && ed === e) document.getElementById("acoesEd").innerHTML = acoesEd();
    } catch (err) {
      console.error(err);
      mostrarStatus("Não foi possível salvar. Tente novamente.");
    }
  }

  function agendar() {
    if (!ed) return;
    mostrarStatus("Salvando…");
    clearTimeout(ed.timer);
    ed.timer = setTimeout(persistir, 700);
  }

  async function sair() {
    if (!ed) return;
    clearTimeout(ed.timer);
    await persistir();
    var o = ed.origem;
    ed = null;
    irPara(o);
  }

  /* ============ AÇÕES ============ */
  async function alternarFavorito(id) {
    var it = await obterItem(id);
    if (!it) return;
    it.favorita = !it.favorita;
    await salvarItem(it);
    irPara(rotaAtual);
  }

  async function excluirComConfirmacao(id, origem) {
    if (!confirm("Excluir este registro? Essa ação não pode ser desfeita.")) return;
    await excluirItem(id);
    aviso("Registro excluído.");
    irPara(origem);
  }

  async function addGratidao() {
    var v = document.getElementById("novaGrat").value.trim();
    if (!v) { aviso("Escreva algo pelo qual você é grata."); return; }
    await salvarItem({ id: novoId(), tipo: "gratidao", data: hojeISO(), texto: v, criada: agora(), editada: agora() });
    aviso("Gratidão registrada com carinho.");
    irPara("gratidao");
  }

  function toggleChip(k, v) {
    ed.obj[k] = ed.obj[k] || [];
    var arr = ed.obj[k];
    var i = arr.indexOf(v);
    if (i >= 0) arr.splice(i, 1); else arr.push(v);
    agendar();
    redesenharEditor();
  }

  function addChip(k) {
    var input = document.getElementById("novaCat");
    var v = input ? input.value.trim() : "";
    if (!v) return;
    ed.obj[k] = ed.obj[k] || [];
    if (ed.obj[k].indexOf(v) < 0) ed.obj[k].push(v);
    agendar();
    redesenharEditor();
  }

  function alternarTema() {
    var novo = escuroAtivo() ? "light" : "dark";
    try { localStorage.setItem("tema", novo); } catch (e) {}

  function limparGravacao() {
    clearInterval(GRV.timer);
    if (GRV.stream) GRV.stream.getTracks().forEach(function (t) { t.stop(); });
    GRV.rec = null; GRV.stream = null; GRV.partes = []; GRV.inicio = 0;
    GRV.tempoPausado = 0; GRV.pausadoEm = 0; GRV.timer = null;

  async function gravIniciar() {
    if (GRV.rec) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      aviso("Este navegador não permite gravar áudio. Use o Chrome (Android) ou o Safari atualizado (iPhone).");
      return;
    }
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      aviso(err && err.name === "NotAllowedError"
        ? "Permissão do microfone negada. Ative o microfone para este site nas configurações do navegador."
        : "Não consegui acessar o microfone.");
      return;
    }
    var mime = escolherMime();
    var rec;
    try {
      rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    } catch (err) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      aviso("Não foi possível iniciar a gravação neste navegador.");
      return;
    }
    GRV.rec = rec; GRV.stream = stream; GRV.partes = [];
    GRV.mime = rec.mimeType || mime || "audio/webm";
    rec.ondataavailable = function (e) { if (e.data && e.data.size) GRV.partes.push(e.data); };
    rec.start(1000);
    GRV.inicio = Date.now(); GRV.tempoPausado = 0; GRV.pausadoEm = 0;
    GRV.timer = setInterval(atualizarTempo, 250);
    setEstadoGrav("gravando");
    atualizarTempo();
  }

  function gravPausar() {
    var r = GRV.rec;
    if (!r) return;
    try {
      if (r.state === "recording") {
        r.pause(); GRV.pausadoEm = Date.now(); setEstadoGrav("pausado");
      } else if (r.state === "paused") {
        r.resume(); GRV.tempoPausado += Date.now() - GRV.pausadoEm; GRV.pausadoEm = 0; setEstadoGrav("gravando");
      }
    } catch (err) {
      aviso("Este aparelho não consegue pausar a gravação. Finalize e comece outra.");
    }
  }

  function finalizarGravacao() {
    return new Promise(function (resolve) {
      var r = GRV.rec;
      if (!r) { resolve(false); return; }
      var duracao = tempoDecorrido();
      var partes = GRV.partes, mime = GRV.mime;
      var tituloEl = document.getElementById("gravTitulo");
      var assocEl = document.getElementById("gravAssoc");
      var titulo = tituloEl && tituloEl.value.trim() ? tituloEl.value.trim() : "Gravação de " + fmtDH(agora());
      var assoc = assocEl ? assocEl.value : "";
      r.onstop = async function () {
        limparGravacao();
        try {
          var blob = new Blob(partes, { type: mime });
          await salvarItem({
            id: novoId(), tipo: "audio", titulo: titulo, criada: agora(), editada: agora(),

        } catch (err) {
          console.error(err);

      };
      try { r.stop(); } catch (err) { limparGravacao(); resolve(false); }
    });
  }

  var CRC_TABELA = (function () {
    var t = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);

  function crc32(bytes) {

    for (var i = 0; i < bytes.length; i++) c = CRC_TABELA[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // Cria um ZIP sem compressão (os áudios já vêm comprimidos).
  function criarZip(entradas) {
    var enc = new TextEncoder();
    var partes = [], central = [], offset = 0;
    entradas.forEach(function (en) {
      var nome = enc.encode(en.nome), dados = en.dados, crc = crc32(dados);
      var cab = new DataView(new ArrayBuffer(30));
      cab.setUint32(0, 0x04034b50, true); cab.setUint16(4, 20, true); cab.setUint16(6, 0x0800, true);
      cab.setUint16(8, 0, true); cab.setUint16(10, 0, true); cab.setUint16(12, 0x21, true);
      cab.setUint32(14, crc, true); cab.setUint32(18, dados.length, true); cab.setUint32(22, dados.length, true);
      cab.setUint16(26, nome.length, true); cab.setUint16(28, 0, true);
      partes.push(new Uint8Array(cab.buffer), nome, dados);

      var cen = new DataView(new ArrayBuffer(46));
      cen.setUint32(0, 0x02014b50, true); cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
      cen.setUint16(8, 0x0800, true); cen.setUint16(10, 0, true); cen.setUint16(12, 0, true); cen.setUint16(14, 0x21, true);
      cen.setUint32(16, crc, true); cen.setUint32(20, dados.length, true); cen.setUint32(24, dados.length, true);
      cen.setUint16(28, nome.length, true); cen.setUint16(30, 0, true); cen.setUint16(32, 0, true);
      cen.setUint16(34, 0, true); cen.setUint16(36, 0, true); cen.setUint32(38, 0, true); cen.setUint32(42, offset, true);
      central.push(new Uint8Array(cen.buffer), nome);
      offset += 30 + nome.length + dados.length;
    });
    var tamCentral = central.reduce(function (s, p) { return s + p.length; }, 0);
    var fim = new DataView(new ArrayBuffer(22));
    fim.setUint32(0, 0x06054b50, true); fim.setUint16(4, 0, true); fim.setUint16(6, 0, true);
    fim.setUint16(8, entradas.length, true); fim.setUint16(10, entradas.length, true);
    fim.setUint32(12, tamCentral, true); fim.setUint32(16, offset, true); fim.setUint16(20, 0, true);
    return new Blob(partes.concat(central, [new Uint8Array(fim.buffer)]), { type: "application/zip" });
  }

  // Lê um ZIP criado pelo próprio app (sem compressão).
  function lerZip(buf) {
    var dv = new DataView(buf), bytes = new Uint8Array(buf), eocd = -1;
    for (var i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("ZIP inválido");
    var total = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder(), out = {};
    for (var k = 0; k < total; k++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("ZIP inválido");
      var metodo = dv.getUint16(p + 10, true), tam = dv.getUint32(p + 20, true);
      var nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      var locOff = dv.getUint32(p + 42, true);
      var nome = dec.decode(bytes.subarray(p + 46, p + 46 + nl));
      if (metodo !== 0) throw new Error("ZIP com compressão não suportada");
      var ln = dv.getUint16(locOff + 26, true), le = dv.getUint16(locOff + 28, true);
      var ini = locOff + 30 + ln + le;
      out[nome] = bytes.slice(ini, ini + tam);
      p += 46 + nl + el + cl;
    }
    return out;
  }

  async function exportarBackup() {
    var itens = await operar("readonly", function (s) { return s.getAll(); });
    if (!itens.length) { aviso("Ainda não há dados para exportar."); return; }
    var enc = new TextEncoder(), entradas = [], lista = [];
    for (var k = 0; k < itens.length; k++) {
      var it = itens[k];
      if (it.tipo === "audio" && it.blob) {
        var m = it.mime || "";
        var ext = m.indexOf("mp4") >= 0 ? "m4a" : m.indexOf("ogg") >= 0 ? "ogg" : "webm";
        var arq = "audios/" + it.id + "." + ext;
        entradas.push({ nome: arq, dados: new Uint8Array(await it.blob.arrayBuffer()) });
        var copia = Object.assign({}, it);
        delete copia.blob;
        copia.arquivo = arq;
        lista.push(copia);
      } else {
        lista.push(it);
      }
    }
    var doc = { app: "meu-espaco", formato: 1, criadoEm: agora(), total: lista.length, itens: lista };
    var json = JSON.stringify(doc);
    var blob, nome;
    if (entradas.length) {
      entradas.unshift({ nome: "backup.json", dados: enc.encode(json) });
      blob = criarZip(entradas);
      nome = "meu-espaco-backup-" + hojeISO() + ".zip";
    } else {
      blob = new Blob([json], { type: "application/json" });
      nome = "meu-espaco-backup-" + hojeISO() + ".json";
    }
    baixarArquivo(blob, nome);
    try { localStorage.setItem("ultimoBackup", agora()); } catch (e) {}
    aviso("Backup criado. Guarde o arquivo em um lugar seguro.");
    irPara("config");
  }

  function baixarArquivo(blob, nome) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }

  function validarBackup(doc) {
    if (!doc || doc.app !== "meu-espaco" || !Array.isArray(doc.itens)) return "Este arquivo não é um backup do Meu Espaço.";
    var invalido = doc.itens.some(function (i) {
      return !i || typeof i.id !== "string" || TIPOS_VALIDOS.indexOf(i.tipo) < 0;
    });
    return invalido ? "O backup contém registros fora do formato esperado. Nada foi alterado." : null;
  }

  function descreverBackup(doc) {
    var cont = {};
    doc.itens.forEach(function (i) { cont[i.tipo] = (cont[i.tipo] || 0) + 1; });
    return Object.keys(cont).map(function (t) { return cont[t] + " " + ROTULOS[t]; }).join(", ") +
      " (feito em " + fmtDH(doc.criadoEm) + ")";
  }

  async function aplicarBackup(doc, arquivos, substituir) {
    try {
      if (substituir) await operar("readwrite", function (s) { return s.clear(); });
      var semAudio = 0;
      for (var k = 0; k < doc.itens.length; k++) {
        var item = Object.assign({}, doc.itens[k]);
        if (item.tipo === "audio") {
          if (item.arquivo && arquivos && arquivos[item.arquivo]) {
            item.blob = new Blob([arquivos[item.arquivo]], { type: item.mime || "audio/webm" });
          } else {
            semAudio++;
          }
          delete item.arquivo;
        }
        await salvarItem(item);
      }
      aviso("Backup restaurado com sucesso." + (semAudio ? " " + semAudio + " gravação(ões) sem arquivo de áudio." : ""));
      irPara("config");
    } catch (err) {
      console.error(err);
      aviso("A restauração não foi concluída. Importe o backup novamente.");
    }
  }

  async function importarArquivo(file) {
    if (!file) return;
    var doc, arquivos = null;
    try {
      var buf = await file.arrayBuffer();
      var cabeca = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
      if (cabeca[0] === 0x50 && cabeca[1] === 0x4b) {
        arquivos = lerZip(buf);
        if (!arquivos["backup.json"]) throw new Error("sem backup.json");
        doc = JSON.parse(new TextDecoder().decode(arquivos["backup.json"]));
      } else {
        doc = JSON.parse(new TextDecoder().decode(buf));
      }
    } catch (err) {
      console.error(err);
      aviso("Este arquivo não pôde ser lido. Escolha um backup gerado pelo Meu Espaço.");
      return;
    }
    var problema = validarBackup(doc);
    if (problema) { aviso(problema); return; }

    if (confirm("Backup encontrado: " + descreverBackup(doc) + ".\n\nOK = adicionar estes registros aos atuais (mesclar).\nCancelar = ver a opção de substituir tudo.")) {
      await aplicarBackup(doc, arquivos, false);
    } else if (confirm("Substituir TODOS os dados deste aparelho pelo backup?\n\nOs registros atuais serão apagados. Essa ação não pode ser desfeita.")) {
      await aplicarBackup(doc, arquivos, true);
    } else {
      aviso("Restauração cancelada. Nada foi alterado.");
    }
  }

  // Palavras-base para rimas. Palavras dos seus textos também são usadas.
  var PALAVRAS_RIMA = ["amor","dor","cor","flor","calor","sabor","valor","favor","temor","sol","lencol","anzol","mao","coracao","razao","paixao","cancao","ilusao","emocao","solidao","direcao","oracao","vida","ferida","partida","saida","despedida","medida","querida","perdida","luz","cruz","conduz","saudade","verdade","liberdade","cidade","felicidade","bondade","vontade","tempestade","estrada","madrugada","alvorada","jornada","mar","lugar","olhar","sonhar","chorar","falar","cantar","esperar","voar","luar","altar","ceu","veu","papel","nuvem","viver","renascer","noite","alegria","poesia","melodia","harmonia","paz","capaz","jamais","vento","momento","sentimento","pensamento","alento","silencio","tempo","espelho","conselho","caminho","carinho","brilho","tudo","estrela","janela","tela","pele","fe","cafe","sorrir","partir","sentir","porvir","segredo","medo","cedo","enredo"];

  function frasesDoTexto(t) {
    return String(t || "").split(/[.!?\n]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 1; });
  }

  function classificarFrase(s) {
    var n = SEM_ACENTO(s);
    if (PALAVRAS_DUVIDA.some(function (d) { return n.indexOf(d) >= 0; })) return "duvidas";
    if (PALAVRAS_EMOCIONAIS.some(function (e) { return new RegExp("\\b" + e + "\\b").test(n); })) return "sentimentos";
    return "fatos";
  }

  // Final da rima: a partir da última sequência de vogais (ex.: amor -> or, coração -> ao).
  function fimRima(n) {
    var m = n.match(/[aeiou]+[^aeiou]*$/);
    return m ? m[0] : n;
  }

  async function bancoRimas() {

    } catch (e) {}
    var palavras = PALAVRAS_RIMA.concat(textos.join(" ").split(/[^A-Za-zÀ-ÿ]+/).filter(function (w) { return w.length >= 3; }));
    var vistos = {}, banco = [];
    palavras.forEach(function (w) {
      var k = SEM_ACENTO(w);
      if (!vistos[k]) { vistos[k] = true; banco.push(w); }
    });
    return banco;
  }

  function copiarFallback(texto) {

    try { document.execCommand("copy"); aviso("Copiado. Cole onde quiser."); }
    catch (e) { aviso("Não consegui copiar. Selecione o texto e copie manualmente."); }
    ta.remove();
  }

  function copiarTexto(texto) {

      navigator.clipboard.writeText(texto)
        .then(function () { aviso("Copiado. Cole onde quiser."); })
        .catch(function () { copiarFallback(texto); });
    } else {
      copiarFallback(texto);
    }
  }

  function resultadoOrg(modo, texto) {

    if (!fr.length) return '<p class="dica">Escreva alguns pensamentos primeiro.</p>';

    if (modo === "topicos") {
      return blocoResultado("Pensamentos em tópicos", [fr.map(function (s) { return "• " + s; }).join("\n")]);

      var g = { fatos: [], sentimentos: [], duvidas: [] };
      fr.forEach(function (s) { g[classificarFrase(s)].push(s); });
      return blocoResultado("Fatos", g.fatos.map(function (s) { return "• " + s; })) +

        '<p class="dica">Esta separação é automática e pode errar. Ajuste o que for preciso.</p>';
    }
    if (modo === "temas") {
      var cont = {}, original = {};
      fr.join(" ").split(/[^A-Za-zÀ-ÿ]+/).forEach(function (w) {

        if (k.length > 4 && PALAVRAS_VAZIAS.indexOf(k) < 0) {
          cont[k] = (cont[k] || 0) + 1;

      return blocoResultado("Temas que mais aparecem", top.length ? [top.map(function (k) { return original[k]; }).join(", ")] : []);
    }

      var cls = fr.map(classificarFrase);
      if (cls.indexOf("sentimentos") >= 0) perg.unshift("O que mais pesa nisso hoje?");

      var linhas = fr.map(function (s) { return s.charAt(0).toUpperCase() + s.slice(1); });

      for (var i = 0; i < linhas.length; i += 4) estrofes.push(linhas.slice(i, i + 4).join("\n"));

      fr.forEach(function (s) { var k = SEM_ACENTO(s); rep[k] = (rep[k] || 0) + 1; });

          : '<p class="dica">Nenhuma frase se repete. Se quiser um refrão, escreva uma frase que resuma o sentimento principal.</p>');
    }
    if (modo === "resumo") {
      var principais = texto.split(/\n\s*\n/).map(function (p) { return frasesDoTexto(p)[0]; }).filter(Boolean);

        '<p class="dica">Este resumo apenas escolhe trechos do seu texto. Nada foi alterado.</p>';
    }
    return "";

      '<select id="asstServico">' + servicos.map(function (s) {
        return '<option value="' + s[0] + '">' + s[1] + "</option>";
      }).join("") + "</select>" +
      '<label class="check"><input type="checkbox" id="asstConsentimento"> Autorizo enviar exatamente este texto para o serviço escolhido, nesta vez.</label>' +
      '<div class="acoes"><button class="botao-principal" data-a="asstEnviar">Copiar e abrir serviço</button>' +
      '<button class="botao-secundario" data-a="asstCancelar">Cancelar</button></div></div>';
  }

  async function telaAssistenteCriativo() {
    var abas = [["vocab", "Vocabulário"], ["rimas", "Rimas"], ["imagens", "Imagens"], ["organizar", "Organizar"]];
    document.getElementById("pagina").innerHTML = cabecalho("Meu Assistente Criativo", "inicio") +
      '<div class="abas">' + abas.map(function (a) {
        return '<button class="aba ' + (ASST.aba === a[0] ? "ativa" : "") + '" data-a="asstAba" data-v="' + a[0] + '">' + a[1] + "</button>";
      }).join("") + "</div>" +
      blocoEntrada(ASST.aba) +
      (ASST.pendente ? blocoEnvio(ASST.pendente) : "") +
      (ASST.saida || "") +
      '<p class="dica">Tudo funciona neste aparelho, sem internet. Nenhum texto seu é enviado para fora.</p>';
  }

  /* ============ INÍCIO ============ */
  var h = new Date().getHours();
  document.getElementById("saudacao").textContent =
    (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", que bom ter você aqui";

  try { aplicarTema(localStorage.getItem("tema")); } catch (e) {}

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    INSTALAR_EVENTO = e;
  });

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(function (ok) { PERSISTENTE = !!ok; }).catch(function () {});
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function (err) { console.error(err); });
    });
  }
})();
</script>
</body>
</html>
